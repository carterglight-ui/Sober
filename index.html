<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sober Pile">
  <meta name="description" content="Every sober day drops a bottle on the pile.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <title>Sober Pile</title>
</head>
<body>
  <div id="app">
    <main id="screens">
      <!-- TODAY -->
      <section id="screen-today" class="screen active" data-screen="today">
        <header class="top-bar">
          <span class="kicker">Your progress</span>
          <button class="gear" data-action="settings" aria-label="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
          </button>
        </header>
        <div class="headline">
          <h1><span id="dayCount">0</span> <span id="dayWord">days</span> sober</h1>
          <p id="subline">One day at a time.</p>
        </div>

        <div class="stage-wrap">
          <div class="stage" id="stage">
            <canvas id="pileCanvas" aria-label="Pile of bottles you didn't drink"></canvas>
            <div id="liquidView" class="liquid-view" hidden></div>
            <div class="seg" role="tablist">
              <button class="on" data-action="view" data-view="bottles">Bottles</button>
              <button data-action="view" data-view="liquid">Liquid</button>
            </div>
          </div>
          <p class="stage-caption" id="captionMain">0 bottles you didn't drink</p>
        </div>

        <div class="stats-row">
          <div><b id="qsMoney">$0</b><span>Money saved</span></div>
          <div><b id="qsVolume">0 L</b><span>Alcohol avoided</span></div>
        </div>
        <p class="basis"><span id="basisText"></span> · <button class="link" data-action="settings">Edit</button></p>

        <button class="milestone" data-action="tab" data-tab="progress">
          <div class="ms-top"><span id="msLabel">Next milestone</span><span id="msCount" class="num"></span></div>
          <div class="bar"><i id="msBar"></i></div>
        </button>

        <button class="btn primary big cta" data-action="checkin">
          <span id="checkinLabel">Check in for today</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <p class="breath-link"><button class="link plain" data-action="craving">Need support with a craving?</button></p>
      </section>

      <section id="screen-progress" class="screen" data-screen="progress"></section>
      <section id="screen-journal" class="screen" data-screen="journal"></section>
      <section id="screen-support" class="screen" data-screen="support"></section>
      <section id="screen-more" class="screen" data-screen="more"></section>
    </main>

    <nav class="tabbar">
      <button class="tab on" data-action="tab" data-tab="today">
        <svg viewBox="0 0 24 24"><path class="fillable" d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg><span>Today</span>
      </button>
      <button class="tab" data-action="tab" data-tab="progress">
        <svg viewBox="0 0 24 24"><rect class="fillable" x="4" y="13" width="4" height="8" rx="1"/><rect class="fillable" x="10" y="8" width="4" height="13" rx="1"/><rect class="fillable" x="16" y="3" width="4" height="18" rx="1"/></svg><span>Progress</span>
      </button>
      <button class="tab" data-action="tab" data-tab="journal">
        <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>Journal</span>
      </button>
      <button class="tab" data-action="tab" data-tab="support">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="2.8"/><circle cx="5" cy="9" r="2.2"/><circle cx="19" cy="9" r="2.2"/><path d="M7 20v-1.5a5 5 0 0110 0V20z"/><path d="M1.5 19v-.8A3.6 3.6 0 015 14.6M22.5 19v-.8a3.6 3.6 0 00-3.5-3.6"/></svg><span>Support</span>
      </button>
      <button class="tab" data-action="tab" data-tab="more">
        <svg viewBox="0 0 24 24"><circle class="dot" cx="5" cy="12" r="1.8"/><circle class="dot" cx="12" cy="12" r="1.8"/><circle class="dot" cx="19" cy="12" r="1.8"/></svg><span>More</span>
      </button>
    </nav>
  </div>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-action="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="craving" class="craving" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/matter.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
