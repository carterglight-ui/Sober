<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7ef">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sober Pile">
  <meta name="description" content="Every sober day drops a bottle on the pile.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <title>Sober Pile</title>
</head>
<body>
  <div id="app">
    <main id="screens">
      <!-- TODAY -->
      <section id="screen-today" class="screen active" data-screen="today">
        <header class="top-bar">
          <span class="kicker">Your progress</span>
          <button class="gear" data-action="settings" aria-label="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
          </button>
        </header>
        <div class="headline">
          <h1><span id="dayCount">0</span> <span id="dayWord">days</span> sober</h1>
          <p id="subline">One day at a time.</p>
        </div>

        <div class="stage" id="stage">
          <canvas id="pileCanvas" aria-label="Pile of bottles you didn't drink"></canvas>
          <div id="liquidView" class="liquid-view" hidden></div>
          <div class="seg" role="tablist">
            <button class="on" data-action="view" data-view="bottles">Bottles</button>
            <button data-action="view" data-view="liquid">Liquid</button>
          </div>
          <div class="stage-caption">
            <b id="captionMain">0 bottles you didn't drink</b>
            <span id="captionSub">Tap a bottle to revisit that day.</span>
          </div>
        </div>

        <div class="stats-row">
          <div><b id="qsMoney">$0</b><span>Saved</span></div>
          <div><b id="qsVolume">0 L</b><span>Not consumed</span></div>
          <div><b id="qsTime">0 hrs</b><span>Reclaimed</span></div>
        </div>
        <p class="basis"><span id="basisText"></span> · <button class="link" data-action="settings">Edit</button></p>

        <button class="milestone" data-action="tab" data-tab="journey">
          <div class="ms-top"><span id="msLabel">Next milestone</span><span id="msCount" class="num"></span></div>
          <div class="bar"><i id="msBar"></i></div>
        </button>

        <button class="btn primary big" data-action="checkin">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          <span id="checkinLabel">How are you feeling today?</span>
        </button>
        <button class="btn outline big" data-action="craving">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 9v6M14 9v6"/></svg>
          <span>Having a craving? Let's pause.</span>
        </button>
      </section>

      <section id="screen-journey" class="screen" data-screen="journey"></section>
      <section id="screen-journal" class="screen" data-screen="journal"></section>
      <section id="screen-support" class="screen" data-screen="support"></section>
    </main>

    <nav class="tabbar">
      <button class="tab on" data-action="tab" data-tab="today">
        <svg viewBox="0 0 24 24"><path class="fillable" d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg><span>Today</span>
      </button>
      <button class="tab" data-action="tab" data-tab="journey">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.2"/><path d="M8 18h5a3 3 0 000-6H11a3 3 0 010-6h1"/><path class="fillable" d="M18 2.5a3.5 3.5 0 013.5 3.5c0 2.6-3.5 6-3.5 6s-3.5-3.4-3.5-6A3.5 3.5 0 0118 2.5z"/></svg><span>Journey</span>
      </button>
      <button class="tab" data-action="tab" data-tab="journal">
        <svg viewBox="0 0 24 24"><path class="fillable" d="M2 5.5C4.5 4 8.5 4 12 6c3.5-2 7.5-2 10-.5V19c-2.5-1.5-6.5-1.5-10 .5-3.5-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg><span>Journal</span>
      </button>
      <button class="tab" data-action="tab" data-tab="support">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="2.8"/><circle cx="5" cy="9" r="2.2"/><circle cx="19" cy="9" r="2.2"/><path class="fillable" d="M7 20v-1.5a5 5 0 0110 0V20z"/><path d="M1.5 19v-.8A3.6 3.6 0 015 14.6M22.5 19v-.8a3.6 3.6 0 00-3.5-3.6"/></svg><span>Support</span>
      </button>
    </nav>
  </div>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-action="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="craving" class="craving" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/matter.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
