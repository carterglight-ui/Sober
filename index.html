<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120e0a">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sober Pile">
  <meta name="description" content="Every sober day drops a bottle on the pile.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Sober Pile</title>
</head>
<body>
  <div id="app">
    <main id="screens">
      <!-- PILE -->
      <section id="screen-pile" class="screen active" data-screen="pile">
        <header class="pile-head">
          <div class="eyebrow">Day <span id="dayNum">0</span> · <span id="streakNote"></span></div>
          <h1><span id="bottleCount">0</span> <span id="bottleWord">bottles</span> not drunk</h1>
        </header>
        <div class="stage" id="stage">
          <canvas id="pileCanvas" aria-label="Pile of bottles you didn't drink"></canvas>
          <div id="liquidView" class="liquid-view" hidden></div>
          <div class="stage-tools">
            <div class="seg" role="tablist">
              <button class="on" data-action="view" data-view="bottles">Bottles</button>
              <button data-action="view" data-view="liquid">Liquid</button>
            </div>
            <div class="tool-group">
              <button class="icon-btn" data-action="shake" aria-label="Shake the pile" title="Shake the pile">
                <svg viewBox="0 0 24 24"><path d="M4 8l2-2M4 16l2 2M20 8l-2-2M20 16l-2 2"/><rect x="8" y="4" width="8" height="16" rx="2"/></svg>
              </button>
              <button class="icon-btn" id="soundBtn" data-action="sound" aria-label="Toggle sound" title="Sound">
                <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path class="wave" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>
              </button>
            </div>
          </div>
          <div class="stage-hint" id="stageHint">Tap a bottle to see its day · drag to toss</div>
        </div>
        <div class="quick-stats">
          <div><b id="qsMoney">$0</b><span>saved</span></div>
          <div><b id="qsDrinks">0</b><span>drinks skipped</span></div>
          <div><b id="qsCal">0</b><span>calories</span></div>
        </div>
        <button class="next-up" id="nextUp" data-action="tab" data-tab="progress"></button>
      </section>

      <section id="screen-progress" class="screen" data-screen="progress"></section>
      <section id="screen-journal" class="screen" data-screen="journal"></section>
      <section id="screen-more" class="screen" data-screen="more"></section>
    </main>

    <nav class="tabbar">
      <button class="tab on" data-action="tab" data-tab="pile">
        <svg viewBox="0 0 24 24"><path d="M10 3h4v4l2 3v10a1 1 0 01-1 1H9a1 1 0 01-1-1V10l2-3z"/></svg><span>Pile</span>
      </button>
      <button class="tab" data-action="tab" data-tab="progress">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progress</span>
      </button>
      <button class="tab sos" data-action="craving">
        <span class="sos-ring"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"/></svg></span><span>Craving</span>
      </button>
      <button class="tab" data-action="tab" data-tab="journal">
        <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/></svg><span>Journal</span>
      </button>
      <button class="tab" data-action="tab" data-tab="more">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span>
      </button>
    </nav>
  </div>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-action="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="craving" class="craving" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/matter.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
